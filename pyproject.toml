[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SME-processos-concursos-MS"
version = "0.1.0"
description = "Microsserviço de processos de concursos"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "SME" }]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.ruff]
line-length = 79
target-version = "py312"
extend-exclude = ["migrations", ".venv", "venv", "htmlcov", "__pycache__"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort,
# UP = pyupgrade, B = bugbear, SIM = simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E203",   # conflito com ruff format (whitespace antes de ':')
    "B008",   # função no default arg — comum em DRF
    "SIM401", # .get() != if-in para DRF ReturnList/ReturnDict
]

[tool.ruff.lint.per-file-ignores]
"**/gerar_relatorio_pep*.py" = ["D"]
"__init__.py" = ["F401", "F403", "F405", "D104"]
"config/settings*.py" = ["F401", "F403", "F405", "E501", "E402"]
"*/settings*.py" = ["F401", "F403", "F405", "E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["concursos", "cargos", "autorizacoes", "core", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["pytest.fixture", "extend_schema", "action"]

[tool.coverage.run]
source = ["apps"]

[tool.coverage.report]
show_missing = true
